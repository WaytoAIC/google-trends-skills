skill:
  name: google-trends-hot-radar
  task_name: "<task_slug>"
  task_name_cn: "<中文任务名>"
  language: zh-CN

business_context:
  market: "<例如 Amazon US / DTC US / 内容站>"
  primary_goal_cn: "<从热搜中发现什么机会>"
  report_consumer_cn: "<产品/运营/内容/广告负责人>"

schedule:
  timezone: America/Los_Angeles
  daily_digest_time: "09:00"
  weekly_report_day: "MON"
  weekly_report_time: "09:30"

monitoring_defaults:
  geos:
    - US
  daily_rss_limit_per_geo: 20
  lookback_days: 1

curation_defaults:
  industry_lenses:
    - ecommerce
    - consumer_products
  exclude_topics:
    - celebrity_gossip_without_product_angle
    - politics_without_market_relevance
    - sports_score_only

reporting:
  output_language: zh-CN
  tables_first: true

monitor_groups:
  - group_id: "<english_group_id>"
    group_name_cn: "<中文组名>"
    enabled: true
    priority: 5
    geos:
      - US
    goal_cn:
      - "<从热门词中想发现什么机会>"
    report_focus_cn:
      - "<报告最该强调什么>"
    industry_lenses:
      - ecommerce
      - consumer_products

starter_checklist:
  - "这是热门词机会发现任务，而不是固定关键词曲线任务。"
  - "geo 控制在 1-3 个核心市场。"
  - "行业 lens 只用于筛选机会，不用于要求 RSS 命中特定词。"
